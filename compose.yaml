name: kalma-snkrs-php

services:

  # 1. PROXY INVERSO NGINX
  proxy:
    image: kalma-proxy:${APP_VERSION:-local}
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    # Si el servidor ya tiene el 80/443 ocupado (por ejemplo, un Apache del sistema),
    # los puertos y la dirección pública se cambian desde .env sin tocar este archivo.
    # Sin esas variables, se publica en 80/443 como siempre.
    environment:
      KALMA_HTTPS_ORIGIN: ${KALMA_ORIGEN:-https://kalma.local}
    ports:
      - "${KALMA_PUERTO_HTTP:-80}:80"
      - "${KALMA_PUERTO_HTTPS:-443}:443"
    volumes:
      - ./docker/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - front
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "-q", "-O", "/dev/null", "https://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 5

  # 2. APLICACIÓN PHP CON APACHE
  app:
    image: kalma-app:${APP_VERSION:-local}
    build: .
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:?Falta DB_NAME}
      DB_USER: ${DB_USER:?Falta DB_USER}
      DB_PASSWORD: ${DB_PASSWORD:?Falta DB_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - front
      - back
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - php
        - -r
        - "exit(@file_get_contents('http://127.0.0.1/health') === false ? 1 : 0);"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # 3. BASE DE DATOS POSTGRESQL
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${DB_NAME:?Falta DB_NAME}
      POSTGRES_USER: ${DB_USER:?Falta DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Falta DB_PASSWORD}
    volumes:
      - datos_postgres:/var/lib/postgresql/data
      # Scripts de arranque: Postgres solo los ejecuta si el volumen está vacío.
      # El número del nombre de destino fija el orden de ejecución (esquema, luego datos).
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/seeds/usuarios.sql:/docker-entrypoint-initdb.d/02_usuarios.sql:ro
      - ./database/seeds/catalogo.sql:/docker-entrypoint-initdb.d/03_catalogo.sql:ro
      - ./database/seeds/pedidos.sql:/docker-entrypoint-initdb.d/04_pedidos.sql:ro
    networks:
      - back
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10
      

# REDES INTERNAS
networks:
  front:
    driver: bridge
  back:
    driver: bridge
    internal: true

# VOLUMEN PERSISTENTE
volumes:
  datos_postgres:
