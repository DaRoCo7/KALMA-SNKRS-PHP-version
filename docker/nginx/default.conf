# Limites por IP para la web y los formularios de acceso
limit_req_zone $binary_remote_addr zone=general:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=acceso:10m rate=30r/m;
limit_req_status 429;

server {
    listen 80;
    server_name _;

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    return 301 ${KALMA_HTTPS_ORIGIN}$request_uri;
}

server {
    listen 443 ssl;
    server_name kalma.local localhost;

    ssl_certificate /etc/nginx/certs/kalma.local.pem;
    ssl_certificate_key /etc/nginx/certs/kalma.local-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    root /var/www/html/public;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    error_page 429 = @demasiadas_peticiones;

    # Nginx entrega los recursos del catalogo directamente
    location ~ ^/(css|js|img|fonts)/ {
        try_files $uri =404;
        expires 7d;
        access_log off;
    }

    # Login y registro comparten el limite general y tienen uno adicional
    location ~ ^/(api/)?(login|registro)$ {
        limit_req zone=acceso burst=20 nodelay;
        limit_req zone=general burst=40 nodelay;
        proxy_pass http://app:80;
    }

    location / {
        limit_req zone=general burst=40 nodelay;
        proxy_pass http://app:80;
    }

    location @demasiadas_peticiones {
        default_type application/json;
        add_header Retry-After 60 always;
        return 429 '{"error":{"codigo":429,"mensaje":"Demasiadas peticiones: espera un momento"}}';
    }
}
