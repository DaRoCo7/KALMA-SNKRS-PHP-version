server {
    listen 80;
    server_name _;

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    # Archivos CSS
    location /css/ {
        root /var/www/html/public;
        try_files $uri =404;
        expires 7d;
        access_log off;
    }

    # Archivos JavaScript
    location /js/ {
        root /var/www/html/public;
        try_files $uri =404;
        expires 7d;
        access_log off;
    }

    # Imágenes
    location /img/ {
        root /var/www/html/public;
        try_files $uri =404;
        expires 7d;
        access_log off;
    }

    # Fuentes
    location /fonts/ {
        root /var/www/html/public;
        try_files $uri =404;
        expires 7d;
        access_log off;
    }

    # Resto de peticiones hacia Apache
    location / {
        proxy_pass http://app:80;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}