# =============================================================================
# Proxy inverso de KALMA SNKRS: recibe las peticiones y las pasa al contenedor app
# =============================================================================

# Rate limiting por IP: PRIMERA barrera (la segunda está en PHP, por cuenta y con auditoría)
#   general -> 20 peticiones/segundo por IP en toda la web (frena inundaciones)
#   acceso  -> 30 peticiones/minuto por IP en login y registro (fuerza bruta)
limit_req_zone $binary_remote_addr zone=general:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=acceso:10m  rate=30r/m;
limit_req_status 429;

server {
    listen 80;
    server_name _;

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    # Cabeceras que recibe PHP: la IP real del cliente y el protocolo original
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Al superar un límite se responde en JSON, igual que los errores de la API
    error_page 429 = @demasiadas_peticiones;

    location / {
        limit_req zone=general burst=40 nodelay;
        proxy_pass http://app:80;
    }

    # Páginas y API de login y registro: límite más estricto
    location ~ ^/(api/)?(login|registro)$ {
        limit_req zone=acceso burst=10 nodelay;
        limit_req zone=general burst=40 nodelay;
        proxy_pass http://app:80;
    }

    location @demasiadas_peticiones {
        default_type application/json;
        add_header Retry-After 60 always;
        return 429 '{"error":{"codigo":429,"mensaje":"Demasiadas peticiones: espera un momento"}}';
    }
}
