# Zona para controlar las peticiones por dirección IP
limit_req_zone $binary_remote_addr zone=limite_general:10m rate=60r/m;

# HTTP: redirigir todas las peticiones a HTTPS
server {
    listen 80;
    server_name _;

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    return 301 https://$host:8443$request_uri;
}


# HTTPS: servidor principal
server {
    listen 443 ssl;
    server_name kalma.local localhost;

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    # Certificado HTTPS
    ssl_certificate /etc/nginx/certs/kalma.local.pem;
    ssl_certificate_key /etc/nginx/certs/kalma.local-key.pem;

    ssl_protocols TLSv1.2 TLSv1.3;

    # Archivos CSS
    location /css/ {
        root /var/www/html/public;
        try_files $uri =404;
        expires 7d;
        access_log off;
    }

    # Archivos JavaScript
    location /js/ {
        root /var/www/html/public;
        try_files $uri =404;
        expires 7d;
        access_log off;
    }

    # Imágenes
    location /img/ {
        root /var/www/html/public;
        try_files $uri =404;
        expires 7d;
        access_log off;
    }

    # Fuentes
    location /fonts/ {
        root /var/www/html/public;
        try_files $uri =404;
        expires 7d;
        access_log off;
    }

    # Resto de peticiones hacia Apache/PHP
    location / {
        
         # Limitar peticiones generales por dirección IP
        limit_req zone=limite_general burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://app:80;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}